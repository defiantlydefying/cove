<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4a5d4e" />
    <title>Cove</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf8f5;
        color: #34463a;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(2rem, env(safe-area-inset-top))
          max(2rem, env(safe-area-inset-right))
          max(2rem, env(safe-area-inset-bottom))
          max(2rem, env(safe-area-inset-left));
        box-sizing: border-box;
        text-align: center;
      }

      main {
        max-width: 22rem;
      }

      .mark {
        width: 5.5rem;
        height: 5.5rem;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 38% 62% 55% 45% / 45% 42% 58% 55%;
        background: #dce6dc;
        color: #4a5d4e;
        font-size: 2.5rem;
        font-weight: 700;
      }

      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #657268;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">C</div>
      <h1>Cove</h1>
      <p>Cove could not reach its server. Check your connection and try again.</p>
    </main>
  </body>
</html>
